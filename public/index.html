<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deposit Box</title>
<meta name="theme-color" content="#201d18">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #201d18;
    --ink-soft: #2b2721;
    --paper: #f3ece0;
    --paper-dim: #e6dcc6;
    --rule: #d9a869;
    --pending: #dd6b12;
    --claimed: #2f3a5c;
    --binned: #8a5a3a;
    --danger: #7a2e2e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    padding-bottom: 60px;
  }
  header {
    padding: 28px 20px 18px;
    border-bottom: 1px dashed var(--rule);
  }
  header h1 {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 800;
    font-size: 20px;
    letter-spacing: 0.14em;
    margin: 0;
    text-transform: uppercase;
    color: var(--pending);
  }
  header p {
    margin: 6px 0 0;
    font-size: 13px;
    color: #b8ae9a;
  }
  main { padding: 20px; max-width: 560px; margin: 0 auto; }

  .dropzone {
    background: var(--paper);
    color: var(--ink);
    border: 2px dashed var(--pending);
    border-radius: 10px;
    padding: 36px 20px;
    text-align: center;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.03em;
    box-shadow: 0 8px 0 -2px rgba(221,107,18,0.35);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .dropzone.drag { transform: translateY(2px); box-shadow: 0 4px 0 -2px rgba(221,107,18,0.35); background: #ece2cc; }
  .dropzone .big { font-size: 15px; font-weight: 600; display: block; margin-bottom: 14px; color: var(--pending); }
  .upload-btns { display: flex; flex-direction: column; gap: 10px; }
  .upload-btns button {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13.5px;
    font-weight: 600;
    padding: 13px 14px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
  }
  #cameraBtn { background: var(--pending); color: var(--ink); }
  #galleryBtn { background: transparent; border: 1.5px solid var(--pending); color: var(--pending); }
  #manualBtn { background: transparent; border: 1.5px dashed #9a8c68; color: #6b6250; }

  .manual-form {
    display: none;
    flex-direction: column;
    gap: 8px;
    margin-top: 14px;
    text-align: left;
  }
  .manual-form.open { display: flex; }
  .manual-form label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: #7d745f;
  }
  .manual-form input {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    padding: 10px 11px;
    border: 1px solid #b8ac8c;
    border-radius: 6px;
    background: #fffdf7;
    color: var(--ink);
  }
  .manual-form .save-row { display: flex; gap: 8px; margin-top: 2px; }
  .manual-form .save-row button {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    font-weight: 600;
    padding: 10px 14px;
    border-radius: 6px;
    cursor: pointer;
  }
  .manual-form .save { background: var(--pending); color: var(--ink); border: none; }
  .manual-form .cancel { background: transparent; border: 1px solid #b8ac8c; color: #55503f; }

  .status { margin-top: 14px; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; min-height: 18px; }
  .status.ok { color: #f0a662; }
  .status.err { color: #e39a9a; }
  .status.busy { color: #b8ae9a; }

  section { margin-top: 34px; }
  section > h2 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #b8ae9a;
    margin: 0 0 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  section > h2::after { content: ''; flex: 1; border-top: 1px dashed var(--rule); }

  .empty {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: #7d745f;
    padding: 14px 2px;
  }

  .ticket {
    background: var(--paper);
    color: var(--ink);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 10px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 3px 0 -1px rgba(0,0,0,0.25);
  }
  .ticket::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: repeating-linear-gradient(180deg, var(--rule) 0 4px, transparent 4px 8px);
  }
  .ticket-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .ticket-data { font-family: 'JetBrains Mono', monospace; }
  .ticket-data .id { font-size: 11px; color: #7d745f; letter-spacing: 0.05em; }
  .ticket-data .code { font-size: 19px; font-weight: 800; letter-spacing: 0.04em; margin-top: 2px; }
  .ticket-data .time { font-size: 10.5px; color: #948a72; margin-top: 6px; }

  .stamp {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 4px 8px;
    border: 2px solid currentColor;
    border-radius: 4px;
    transform: rotate(-4deg);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .stamp.pending { color: var(--pending); }
  .stamp.claimed { color: var(--claimed); }
  .stamp.binned { color: var(--binned); }
  .stamp.review { color: var(--danger); }

  .ticket.in-bin { opacity: 0.82; }
  .ticket.in-bin .code { text-decoration: line-through; text-decoration-color: var(--binned); }

  .ticket-actions { display: flex; gap: 8px; margin-top: 12px; }
  .ticket-actions button {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    background: transparent;
    border: 1px solid #b8ac8c;
    color: #55503f;
    padding: 6px 10px;
    border-radius: 5px;
    cursor: pointer;
  }
  .ticket-actions button.danger { border-color: var(--danger); color: var(--danger); }

  .edit-form { margin-top: 10px; display: none; gap: 8px; flex-direction: column; }
  .edit-form.open { display: flex; }
  .edit-form label { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #7d745f; }
  .edit-form input {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    padding: 7px 9px;
    border: 1px solid #b8ac8c;
    border-radius: 5px;
    background: #fffdf7;
  }
  .edit-form .save-row { display: flex; gap: 8px; margin-top: 2px; }
  .edit-form .save-row button {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    padding: 7px 12px;
    border-radius: 5px;
    border: none;
    cursor: pointer;
  }
  .edit-form .save { background: var(--pending); color: var(--ink); }
  .edit-form .cancel { background: transparent; border: 1px solid #b8ac8c; color: #55503f; }

  .ticket-actions button.restore { border-color: var(--pending); color: var(--pending); }

  input[type=file] { display: none; }
</style>
</head>
<body>

<header>
  <h1>Deposit Box</h1>
  <p>Drop a receipt photo to add it to the queue</p>
</header>

<main>
  <div class="dropzone" id="dropzone">
    <span class="big">＋ Add receipt</span>
    <div class="upload-btns">
      <button type="button" id="cameraBtn">📷 Take photo</button>
      <button type="button" id="galleryBtn">🖼 Choose from gallery</button>
      <button type="button" id="manualBtn">✏️ Enter manually</button>
    </div>
    <div class="manual-form" id="manualForm">
      <label>Customer ID</label>
      <input type="text" id="manualIdInput" inputmode="numeric" placeholder="e.g. 1023779">
      <label>Code</label>
      <input type="text" id="manualCodeInput" placeholder="e.g. EB8T6">
      <div class="save-row">
        <button type="button" class="save" id="manualSaveBtn">Add</button>
        <button type="button" class="cancel" id="manualCancelBtn">Cancel</button>
      </div>
    </div>
  </div>
  <input type="file" id="cameraInput" accept="image/*" capture="environment">
  <input type="file" id="galleryInput" accept="image/*">
  <div class="status" id="status"></div>

  <section>
    <h2>Pending</h2>
    <div id="pendingList"></div>
  </section>

  <section>
    <h2>Claimed</h2>
    <div id="claimedList"></div>
  </section>

  <section>
    <h2>Bin</h2>
    <div id="binList"></div>
  </section>
</main>

<script>
const dropzone = document.getElementById('dropzone');
const cameraBtn = document.getElementById('cameraBtn');
const galleryBtn = document.getElementById('galleryBtn');
const manualBtn = document.getElementById('manualBtn');
const manualForm = document.getElementById('manualForm');
const manualIdInput = document.getElementById('manualIdInput');
const manualCodeInput = document.getElementById('manualCodeInput');
const manualSaveBtn = document.getElementById('manualSaveBtn');
const manualCancelBtn = document.getElementById('manualCancelBtn');
const cameraInput = document.getElementById('cameraInput');
const galleryInput = document.getElementById('galleryInput');
const statusEl = document.getElementById('status');

cameraBtn.addEventListener('click', () => cameraInput.click());
galleryBtn.addEventListener('click', () => galleryInput.click());

manualBtn.addEventListener('click', () => {
  manualForm.classList.add('open');
  manualIdInput.focus();
});
manualCancelBtn.addEventListener('click', () => {
  manualForm.classList.remove('open');
  manualIdInput.value = '';
  manualCodeInput.value = '';
});
manualSaveBtn.addEventListener('click', async () => {
  const customer_id = manualIdInput.value.trim();
  const code = manualCodeInput.value.trim();
  if (!customer_id || !code) {
    setStatus('Enter both Customer ID and Code.', 'err');
    return;
  }
  setStatus('Adding…', 'busy');
  try {
    const res = await fetch('/deposit/manual', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ customer_id, code })
    });
    const data = await res.json();
    if (!res.ok) {
      setStatus('Could not add: ' + (data.error || 'unknown error'), 'err');
    } else {
      setStatus(`Added: ID ${data.customer_id}, Code ${data.code}`, 'ok');
      manualIdInput.value = '';
      manualCodeInput.value = '';
      manualForm.classList.remove('open');
      refresh();
    }
  } catch (err) {
    setStatus('Could not add: ' + err.message, 'err');
  }
});

dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('drag');
  if (e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]);
});
cameraInput.addEventListener('change', () => {
  if (cameraInput.files.length) uploadFile(cameraInput.files[0]);
});
galleryInput.addEventListener('change', () => {
  if (galleryInput.files.length) uploadFile(galleryInput.files[0]);
});

async function uploadFile(file) {
  setStatus('Scanning…', 'busy');
  const form = new FormData();
  form.append('receipt', file);
  try {
    const res = await fetch('/deposit/scan', { method: 'POST', body: form });
    const data = await res.json();
    if (!res.ok) {
      setStatus('Upload failed: ' + (data.error || 'unknown error'), 'err');
    } else if (data.needs_review) {
      setStatus(
        `Added, but couldn't read it clearly (ID: ${data.customer_id ?? '—'}, Code: ${data.code ?? '—'}). Tap Edit on it to fill in the rest.`,
        'err'
      );
      refresh();
    } else {
      setStatus(`Added: ID ${data.customer_id}, Code ${data.code}`, 'ok');
      refresh();
    }
  } catch (err) {
    setStatus('Upload failed: ' + err.message, 'err');
  }
  cameraInput.value = '';
  galleryInput.value = '';
}

function setStatus(msg, cls) {
  statusEl.textContent = msg;
  statusEl.className = 'status ' + cls;
}

function fmtTime(iso) {
  return new Date(iso).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

function pendingTicketHtml(r) {
  const flagged = r.needs_review;
  return `
    <div class="ticket" data-id="${r.id}">
      <div class="ticket-row">
        <div class="ticket-data">
          <div class="id">ID ${r.customer_id || '—'}</div>
          <div class="code">${r.code || '— — — — —'}</div>
          <div class="time">${fmtTime(r.created_at)}</div>
        </div>
        <div class="stamp ${flagged ? 'review' : 'pending'}">${flagged ? 'Needs review' : 'Pending'}</div>
      </div>
      <div class="ticket-actions">
        <button onclick="toggleEdit(${r.id})">Edit</button>
        <button class="danger" onclick="removeTicket(${r.id})">Move to bin</button>
      </div>
      <div class="edit-form" id="edit-${r.id}">
        <label>Customer ID</label>
        <input type="text" id="edit-id-${r.id}" value="${r.customer_id || ''}">
        <label>Code</label>
        <input type="text" id="edit-code-${r.id}" value="${r.code || ''}">
        <div class="save-row">
          <button class="save" onclick="saveEdit(${r.id})">Save</button>
          <button class="cancel" onclick="toggleEdit(${r.id})">Cancel</button>
        </div>
      </div>
    </div>
  `;
}

function claimedTicketHtml(r) {
  return `
    <div class="ticket" data-id="${r.id}">
      <div class="ticket-row">
        <div class="ticket-data">
          <div class="id">ID ${r.customer_id}</div>
          <div class="code">${r.code}</div>
          <div class="time">${fmtTime(r.deposited_at)}</div>
        </div>
        <div class="stamp claimed">Claimed</div>
      </div>
    </div>
  `;
}

function binTicketHtml(r) {
  return `
    <div class="ticket in-bin" data-id="${r.id}">
      <div class="ticket-row">
        <div class="ticket-data">
          <div class="id">ID ${r.customer_id}</div>
          <div class="code">${r.code}</div>
          <div class="time">${fmtTime(r.removed_at)}</div>
        </div>
        <div class="stamp binned">Removed</div>
      </div>
      <div class="ticket-actions">
        <button class="restore" onclick="restoreTicket(${r.id})">Restore</button>
        <button class="danger" onclick="deleteForever(${r.id})">Delete forever</button>
      </div>
    </div>
  `;
}

function toggleEdit(id) {
  document.getElementById('edit-' + id).classList.toggle('open');
}

async function saveEdit(id) {
  const customer_id = document.getElementById('edit-id-' + id).value.trim();
  const code = document.getElementById('edit-code-' + id).value.trim();
  await fetch('/deposit/' + id, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ customer_id, code })
  });
  refresh();
}

async function removeTicket(id) {
  await fetch('/deposit/' + id, { method: 'DELETE' });
  refresh();
}

async function restoreTicket(id) {
  await fetch('/deposit/' + id + '/restore', { method: 'POST' });
  refresh();
}

async function deleteForever(id) {
  await fetch('/deposit/' + id + '/permanent', { method: 'DELETE' });
  refresh();
}

async function refresh() {
  const pending = await (await fetch('/deposit/pending')).json();
  const claimed = await (await fetch('/deposit/deposited')).json();
  const binned = await (await fetch('/deposit/bin')).json();

  document.getElementById('pendingList').innerHTML = pending.length
    ? pending.map(pendingTicketHtml).join('')
    : '<div class="empty">No pending receipts. Add one above.</div>';

  document.getElementById('claimedList').innerHTML = claimed.length
    ? claimed.map(claimedTicketHtml).join('')
    : '<div class="empty">Nothing claimed yet.</div>';

  document.getElementById('binList').innerHTML = binned.length
    ? binned.map(binTicketHtml).join('')
    : '<div class="empty">Bin is empty.</div>';
}

refresh();
setInterval(refresh, 5000);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
